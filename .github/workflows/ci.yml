name: C++ CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install compiler
      run: sudo apt update && sudo apt install -y g++

    - name: Build
      run: make

    - name: Run application
      run: ./app

